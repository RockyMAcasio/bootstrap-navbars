<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Navbars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      <div class="container d-flex align-items-center">
        <ul class="nav justify-content-start flex-fill">
          <li>
            <a class="navbar-brand" href="#" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
          </li>
        </ul>

        <ul class="nav justify-content-center flex-fill">
          <li>
            <img src="boardroom.png" alt="The Boardroom Kailua"

          </li>
        </ul>

        <ul class="nav justify-content-end flex-fill">
          <li><button class="btn btn-dark" type="button">Menu</button></li>
        </ul>
      </div>
    </nav>
  </div>

</html>
