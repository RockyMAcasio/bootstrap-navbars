<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Navbars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</head>
<body>
  <div class="container-fluid px-0 boardroom-nav">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container d-flex align-items-center">
        <ul class="nav justify-content-start flex-fill">
          <li>
            <a class="navbar-brand" href="#" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
          </li>
        </ul>

        <ul class="nav justify-content-center flex-fill">
          <li>
            <img src="boardroom.png" alt="The Boardroom Kailua"
                 height="70">
          </li>
        </ul>

        <ul class="nav justify-content-end flex-fill">
          <li><button class="btn btn-dark" type="button">Menu</button></li>
        </ul>
      </div>
    </nav>
  </div>

  <div class="morning-brew">
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container py-2">
      <div class="mx-auto navbar-nav">
        <img src="morning-brew-logo.png" alt="Morning Brew Hawaii" width="190">
      </div>
    </div>
  </nav>

  <div class="navbar navbar-expand-lg bg-light sticky-top">
    <div class="container">
      <div class="mx-auto navbar-nav flex-row flex-wrap justify-content-center">
        <div class="nav-item border-3 border-top border-dark active">Home</div>
        <div class="nav-item border-1 border-top border-dark">Order Online</div>
        <div class="nav-item border-1 border-top border-dark">Menus</div>
        <div class="nav-item border-1 border-top border-dark">Locations</div>
        <div class="nav-item border-1 border-top border-dark">About</div>
        <div class="nav-item border-1 border-top border-dark">Shop</div>
        <div class="nav-item border-1 border-top border-dark">Contact</div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid px-0 buzzs-nav">
  <nav class="navbar navbar-expand-lg bg-gradient">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <ul class="nav justify-content-start align-items-center">
        <li class="nav-item"><h4 class="px-2 mb-0">LUNCH</h4></li>
        <li class="nav-item"><h4 class="px-2 mb-0">DINNER</h4></li>
        <li class="nav-item"><h4 class="px-2 mb-0">DRINKS &amp; PUPU</h4></li>
      </ul>

      <ul class="nav justify-content-center">
        <li>
          <img src="buzzs-logo.png" alt="Buzz's Original Steak House" height="70">
        </li>
      </ul>

      <ul class="nav justify-content-end align-items-center">
        <li class="nav-item"><h4 class="px-2 mb-0">ABOUT</h4></li>
        <li class="nav-item"><h4 class="px-2 mb-0">LOCATION</h4></li>
        <li class="nav-item"><h4 class="px-2 mb-0">SHOP</h4></li>
        <li class="nav-item">
          <h4 class="px-2 mb-0"><i class="bi bi-cart3"></i></h4>
        </li>
      </ul>
    </div>
  </nav>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-light aloha-nav">
  <div class="container">
    <a class="navbar-brand" href="#">
      <img src="aloha-beer-logo.png" alt="Aloha Beer" width="110">
    </a>

    <div class="nav justify-content-center flex-fill">
      <a class="nav-link" href="#">Locations &amp; Menus</a>
      <a class="nav-link" href="#">Events</a>
      <a class="nav-link" href="#">Brewery</a>
      <a class="nav-link shop-link" href="#">Shop</a>
    </div>

    <div class="nav justify-content-end">
      <a class="nav-link" href="#">Account</a>
      <a class="nav-link" href="#" aria-label="Search">
        <i class="bi bi-search"></i>
      </a>
      <a class="nav-link" href="#" aria-label="Cart">
        <i class="bi bi-cart3"></i>
      </a>
    </div>
  </div>
</nav>
</body>
</html>
